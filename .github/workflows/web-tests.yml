name: Vérification du prototype web et des règles candidates

on:
  push:
    branches: [web-messagerie]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifications statiques HTML et configuration
        run: python3 test_web_smoke.py
      - name: Dépendances de test
        run: npm install
      - name: Installer Chromium pour le test navigateur
        run: npx playwright install --with-deps chromium
      - name: Tests Firestore Rules Emulator (projet demo uniquement)
        run: npm run test:rules
      - name: Écrire la configuration fictive runtime (ignorée par git)
        run: cp web/local-config.example.js web/local-config.js
      - name: Test de bout en bout Chromium avec Auth et Firestore Emulator uniquement
        run: npx firebase emulators:exec --only auth,firestore --project demo-local-chat-hybride-rules "npm run test:e2e"
