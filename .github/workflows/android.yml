name: Construire l'APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Construire l'APK debug
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Rendre l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: L1-AP-B-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Conserver l’APK release non signé
        uses: actions/upload-artifact@v4
        with:
          name: application-release-non-signee
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Fournir temporairement le fichier APK
        run: |
          curl --fail --silent --show-error --max-time 120 -F file=@app/build/outputs/apk/debug/app-debug.apk -F expire=172800 https://tmpfiles.org/api/v1/upload
          echo
