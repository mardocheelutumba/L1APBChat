name: Construire l'APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Construire l'APK debug
        run: gradle --no-daemon assembleDebug
      - name: Rendre l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: L1-AP-B-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Fournir temporairement le fichier APK
        run: |
          curl --fail --silent --show-error --max-time 120 -F reqtype=fileupload -F time=72h -F fileToUpload=@app/build/outputs/apk/debug/app-debug.apk https://litterbox.catbox.moe/resources/internals/api.php
          echo
